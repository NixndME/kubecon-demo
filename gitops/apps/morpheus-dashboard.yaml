apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: morpheus-dashboard
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/NixndME/kubecon-demo.git
    targetRevision: main
    path: gitops/platform/morpheus-dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: morpheus-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
