# Set by the Morpheus catalog order
# Chat name: the person's first name, used for the web address and the namespace
name: demo
team: ""
model: llama3.2:3b
requestedBy: ""
ownerName: ""
# Login for the chat page
ownerEmail: ""
chatPassword: ""

domain: kubeforge.live

# Size of the chat: how much GPU memory it gets, enforced by HAMi (MiB).
# Compute is shared: a chat can use the whole GPU when the others are idle.
size: small

# Chat with your documents: people upload files and ask about them. The files are indexed by a small
# embedding model on the same Ollama, so nothing leaves the cluster.
documents: false
embedModel: nomic-embed-text
sizes:
  small: 3072
  medium: 4096
  large: 8192

ollama:
  image: ollama/ollama:0.40.0
  # All chats share one model folder on the GPU node, so a model is downloaded only once
  modelCache: /mnt/hks-data/ollama-models

webui:
  image: ghcr.io/open-webui/open-webui:0.11.4
  storage: 2Gi
