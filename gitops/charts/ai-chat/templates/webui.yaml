# Open WebUI: the chat page at https://<name>.<domain>, with its own login
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webui
  labels: {{- include "ai-chat.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.webui.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  labels: {{- include "ai-chat.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
        {{- include "ai-chat.labels" . | nindent 8 }}
      annotations: {{- include "ai-chat.annotations" . | nindent 8 }}
    spec:
      containers:
        - name: webui
          image: {{ .Values.webui.image }}
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: WEBUI_NAME
              value: {{ printf "%s AI" (.Values.name | title) | quote }}
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "false"
            - name: ENABLE_EVALUATION_ARENA_MODELS
              value: "false"
            - name: DEFAULT_MODELS
              value: {{ .Values.model | quote }}
            # Log each chat request (who asked what) to the pod log, for the Grafana dashboard
            - name: AUDIT_LOG_LEVEL
              value: REQUEST
            - name: AUDIT_INCLUDED_PATHS
              value: chat/completions
            - name: ENABLE_AUDIT_STDOUT
              value: "true"
            - name: ENABLE_AUDIT_LOGS_FILE
              value: "false"
            # The web page sends many settings before the messages; keep enough of the request to see the question
            - name: MAX_BODY_LOG_SIZE
              value: "65536"
          envFrom:
            - secretRef:
                name: webui-login
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: webui
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  labels: {{- include "ai-chat.labels" . | nindent 4 }}
spec:
  selector:
    app: webui
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webui
  labels: {{- include "ai-chat.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ printf "%s.%s" .Values.name .Values.domain | quote }}]
      secretName: webui-tls
  rules:
    - host: {{ printf "%s.%s" .Values.name .Values.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webui
                port:
                  number: 80
