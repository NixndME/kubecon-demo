# Ollama: runs the chat's model on one GPU slice
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels: {{- include "ai-chat.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        {{- include "ai-chat.labels" . | nindent 8 }}
      annotations: {{- include "ai-chat.annotations" . | nindent 8 }}
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          # Start the server, then fetch the model if it is not in the shared folder yet
          command: ["sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull {{ .Values.model }}; wait"]
          env:
            - name: OLLAMA_MODELS
              value: /models
          ports:
            - containerPort: 11434
          readinessProbe:
            exec:
              command: ["sh", "-c", "ollama list | grep -q '{{ .Values.model }}'"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          hostPath:
            path: {{ .Values.ollama.modelCache }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels: {{- include "ai-chat.labels" . | nindent 4 }}
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
