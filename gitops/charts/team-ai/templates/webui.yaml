# Open WebUI: the team's chat page at https://<team>.<domain>, behind the shared login prompt
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webui
  labels: {{- include "team-ai.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.webui.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  labels: {{- include "team-ai.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
        {{- include "team-ai.labels" . | nindent 8 }}
    spec:
      containers:
        - name: webui
          image: {{ .Values.webui.image }}
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: WEBUI_NAME
              value: {{ printf "%s AI" (.Values.team | title) | quote }}
            # One user per team; the login prompt in front of the page protects it
            - name: WEBUI_AUTH
              value: "False"
            - name: ENABLE_OPENAI_API
              value: "false"
            - name: ENABLE_EVALUATION_ARENA_MODELS
              value: "false"
            - name: DEFAULT_MODELS
              value: {{ .Values.model | quote }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: webui
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  labels: {{- include "team-ai.labels" . | nindent 4 }}
spec:
  selector:
    app: webui
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webui
  labels: {{- include "team-ai.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.loginMiddleware }}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ printf "%s.%s" .Values.team .Values.domain | quote }}]
      secretName: webui-tls
  rules:
    - host: {{ printf "%s.%s" .Values.team .Values.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webui
                port:
                  number: 80
