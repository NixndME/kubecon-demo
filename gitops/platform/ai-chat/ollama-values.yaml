# Ollama runs the model on the GPU. The model is downloaded once and kept on the data disk.
ollama:
  gpu:
    enabled: true
    type: nvidia
    number: 1
  models:
    pull:
      - llama3.2:3b

persistentVolume:
  enabled: true
  size: 40Gi
  storageClass: local-path

# HAMi keeps it inside 3 GiB of GPU memory, so other chats always have room
resources:
  limits:
    nvidia.com/gpumem: "3072"
