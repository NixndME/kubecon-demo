# Alloy: sends the logs of the AI chat pods to Loki
alloy:
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Only the AI chat namespaces: ai-<first name> and the main ai-chat
      discovery.relabel "ai" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "ai-.*"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_kubecon_demo_team"]
          target_label  = "team"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_kubecon_demo_owner"]
          target_label  = "owner"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_kubecon_demo_model"]
          target_label  = "model"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_kubecon_demo_size"]
          target_label  = "size"
        }
      }

      loki.source.kubernetes "ai" {
        targets    = discovery.relabel.ai.output
        forward_to = [loki.write.default.receiver]
      }

      // Cluster events: chats created, ready, removed (Argo CD) and waiting for a GPU (scheduler).
      // Kubernetes keeps events for about an hour; Loki keeps them for 7 days.
      loki.source.kubernetes_events "events" {
        job_name   = "events"
        log_format = "logfmt"
        forward_to = [loki.process.chat_events.receiver]
      }

      // Keep only events about AI chats: Argo CD apps named ai-* and anything in ai-* namespaces
      loki.process "chat_events" {
        stage.match {
          selector = "{job=\"events\", namespace!~\"ai-.+\"} !~ \"name=ai-\""
          action   = "drop"
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc:3100/loki/api/v1/push"
        }
      }

controller:
  type: deployment
  replicas: 1
