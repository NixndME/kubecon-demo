# NVIDIA GPU Operator: lets pods ask for a GPU (nvidia.com/gpu) and exports GPU metrics.
# The driver is already on the node from the cluster layout, so the operator does not install one.
driver:
  enabled: false

toolkit:
  enabled: true

# Time-slicing: each GPU is offered as 4, so 4 pods can each get "1 GPU" and take turns on it.
# GPU memory is shared, not split: the apps on one GPU must fit in its memory together.
devicePlugin:
  enabled: true
  config:
    create: true
    name: time-slicing-config
    default: any
    data:
      any: |-
        version: v1
        flags:
          migStrategy: none
        sharing:
          timeSlicing:
            renameByDefault: false
            failRequestsGreaterThanOne: true
            resources:
              - name: nvidia.com/gpu
                replicas: 4

dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true

# Not needed for a T4: no MIG, no VM passthrough, no confidential computing
migManager:
  enabled: false
vfioManager:
  enabled: false
ccManager:
  enabled: false
sandboxWorkloads:
  enabled: false
