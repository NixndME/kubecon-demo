# Grafana dashboards kept in Git; Grafana's sidecar loads every ConfigMap with the grafana_dashboard label
namespace: grafana
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: AI
configMapGenerator:
  - name: dashboard-ai-chats
    files:
      - ai-chats.json
  - name: dashboard-ai-cost
    files:
      - ai-cost.json
