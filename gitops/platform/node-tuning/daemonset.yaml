# Raises the Linux file watcher limits on every node. Following many pod logs (Loki) runs out of the
# small default and the kubelet then fails with "too many open files".
apiVersion: v1
kind: Namespace
metadata:
  name: node-tuning
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-tuning
  namespace: node-tuning
spec:
  selector:
    matchLabels:
      app: node-tuning
  template:
    metadata:
      labels:
        app: node-tuning
    spec:
      tolerations:
        - operator: Exists
      initContainers:
        - name: sysctl
          image: busybox:1.37
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - sysctl -w fs.inotify.max_user_instances=8192 fs.inotify.max_user_watches=1048576
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
