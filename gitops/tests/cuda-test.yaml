# GPU check: asks Kubernetes for one GPU and runs a small CUDA program. Prints "Test PASSED".
# kubectl apply -f gitops/tests/cuda-test.yaml && kubectl logs -f cuda-test
apiVersion: v1
kind: Pod
metadata:
  name: cuda-test
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: cuda-test
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
      resources:
        limits:
          nvidia.com/gpu: 1
